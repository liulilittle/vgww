name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure, build and test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH exit /b 1
          call "%VSPATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 || exit /b 1
          cmake --version || exit /b 1
          ninja --version || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVGWW_JEMALLOC=OFF || exit /b 1
          cmake --build build --parallel || exit /b 1
          ctest --test-dir build --output-on-failure || exit /b 1

      - name: Gates
        shell: pwsh
        run: |
          $gates = @(
            "js-syntax", "i18n", "web-a11y", "html-safety", "api-contract",
            "web-css", "web-logic", "native-i18n", "source-hygiene",
            "gates-selftest"
          )
          $failed = @()
          foreach ($gate in $gates) {
            node "scripts/check-$gate.mjs" .
            if ($LASTEXITCODE -ne 0) { $failed += $gate }
          }
          if ($failed.Count -ne 0) {
            throw "gate(s) failed: $($failed -join ', ')"
          }

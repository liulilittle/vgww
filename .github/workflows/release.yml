name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MSVC dev shell (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DVGWW_JEMALLOC=OFF

      - name: Build
        run: cmake --build build --target vgww --parallel

      - name: Package
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.tag }}"
          } else { "${{ github.ref_name }}" }
          $stage = "stage/vgww-$tag"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build/vgww.exe $stage
          Copy-Item LICENSE, README.md, README.zh-CN.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "vgww-$tag-win64.zip"
          "TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "vgww-$env:TAG-win64.zip"
          gh release view "$env:TAG" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" $zip --clobber
          } else {
            gh release create "$env:TAG" $zip --generate-notes --title "VGWW $env:TAG"
          }
